<title>Carousel Artboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a light table. The post's artboards sit in swipe order; each frame carries its own controls and review note underneath. */
:root{
  --bg:#ecebea; --surface:#ffffff; --sunken:#e3e0de; --ink:#1a1615; --muted:#625a57; --line:#d2cbc7;
  --accent:#cf2a14; --accent-ink:#ffffff; --focus:#2257d6;
  --st-review:#6a615d; --st-change:#9e4507; --st-ok:#15704a;
  --frame:#0f0c0b;
  --ui:"Nimbus Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131111; --surface:#1c1918; --sunken:#0e0c0c; --ink:#f3eeeb; --muted:#a8a09c; --line:#342f2d;
  --accent:#ff5b3e; --accent-ink:#1b0d0a; --focus:#8db2ff;
  --st-review:#a8a09c; --st-change:#f2a35e; --st-ok:#5fc592; --frame:#000000; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131111; --surface:#1c1918; --sunken:#0e0c0c; --ink:#f3eeeb; --muted:#a8a09c; --line:#342f2d;
  --accent:#ff5b3e; --accent-ink:#1b0d0a; --focus:#8db2ff;
  --st-review:#a8a09c; --st-change:#f2a35e; --st-ok:#5fc592; --frame:#000000; color-scheme:dark}

@font-face{font-family:"Nimbus Sans";src:url("fonts/NimbusSans-Regular.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Nimbus Sans";src:url("fonts/NimbusSans-Bold.otf") format("opentype");font-weight:700;font-style:normal;font-display:swap}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:12px}
.brand{font-weight:700;letter-spacing:-.04em;text-transform:uppercase;font-size:17px;white-space:nowrap}
.brand b{color:var(--accent)}
.grow{flex:1 1 auto}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--st-ok)}
.pill[data-s="saving"] i{background:var(--st-change)}
.pill[data-s="error"] i,.pill[data-s="readonly"] i{background:var(--accent)}
.pill[data-s="local"] i{background:var(--st-review)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
select.ctl,input.ctl,textarea.ctl{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;font-size:14px}
textarea.ctl{min-height:64px;resize:vertical;line-height:1.35}
.top select.ctl{width:auto;max-width:260px}
.lbl{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:5px}

/* post settings */
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 16px;padding-block:18px 6px}
.meta .full{grid-column:1/-1}
h1.title{font-size:clamp(26px,4vw,40px);line-height:1.02;letter-spacing:-.05em;text-transform:uppercase;margin:22px 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:70ch}

/* board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:34px 26px;padding-block:26px}
.card{min-width:0;display:flex;flex-direction:column;gap:10px}
.card-h{display:flex;align-items:center;gap:10px}
.num{font-weight:700;font-size:22px;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.num span{color:var(--muted);font-weight:400;letter-spacing:-.04em}
.kind{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.card-tools{margin-left:auto;display:flex;gap:6px}
.icon{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0}
.icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.frame{display:block;width:100%;padding:0;border:0;background:var(--frame);border-radius:4px;overflow:hidden;cursor:zoom-in;aspect-ratio:2/3;max-width:100%}
.frame canvas{display:block;width:100%;height:100%}
.autonote{font-size:12.5px;color:var(--muted);min-height:1.4em}
.autonote b{color:var(--ink);font-weight:700}
.warn{font-size:12.5px;color:var(--st-change)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.status{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.status button{flex:1;min-height:36px;border:0;background:transparent;cursor:pointer;font-size:13px;color:var(--muted);padding:0 6px}
.status button+button{border-left:1px solid var(--line)}
.status button[aria-pressed="true"][data-v="review"]{background:var(--sunken);color:var(--ink);font-weight:700}
.status button[aria-pressed="true"][data-v="change"]{background:var(--st-change);color:#fff;font-weight:700}
.status button[aria-pressed="true"][data-v="ok"]{background:var(--st-ok);color:#fff;font-weight:700}
.card[data-st="change"] .frame{box-shadow:0 0 0 3px var(--st-change)}
.card[data-st="ok"] .frame{box-shadow:0 0 0 3px var(--st-ok)}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:700;font-size:14px;min-height:32px;display:flex;align-items:center}
.fields{display:grid;gap:10px;padding:8px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rowbox{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px;background:var(--sunken)}
.rowbox .two{grid-template-columns:1.2fr .8fr}
.rowhead{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.range{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.range input{width:100%}
.range output{font-size:12px;color:var(--muted);min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.more{position:relative}
.menu{position:absolute;right:0;top:40px;z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px;display:grid;min-width:170px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.menu button{text-align:left;background:none;border:0;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:14px}
.menu button:hover{background:var(--sunken)}
.menu .danger{color:var(--accent)}

/* sections */
.section{border-top:1px solid var(--line);padding-block:26px}
.section h2{font-size:22px;letter-spacing:-.05em;text-transform:uppercase;margin:0 0 6px}
.section p.hint{color:var(--muted);margin:0 0 14px;max-width:70ch}
.overall{display:grid;gap:12px;max-width:820px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.thumb{display:grid;gap:5px;min-width:0;font-size:12px;color:var(--muted)}
.thumb img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:var(--sunken);display:block}
.thumb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:26px;letter-spacing:-.05em;text-transform:uppercase;margin:0 0 8px}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;max-width:min(960px,calc(100vw - 24px));width:100%}
dialog::backdrop{background:rgba(10,8,8,.6)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg-h h3{margin:0;font-size:17px;letter-spacing:-.03em;text-transform:uppercase}
.dlg-b{padding:16px;max-height:70vh;overflow:auto}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.pick button{border:2px solid transparent;border-radius:8px;padding:0;background:none;cursor:pointer;text-align:left;display:grid;gap:4px;font-size:12px;color:var(--muted)}
.pick button:hover{border-color:var(--accent)}
.pick img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:6px;display:block;background:var(--sunken)}
.pick span{padding:0 4px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#focusDlg{max-width:none;width:auto;background:#0b0909;border-color:#2a2524;color:#f3eeeb}
#focusDlg .dlg-h{border-color:#2a2524}
#focusDlg .icon,#focusDlg .btn{background:#1c1918;border-color:#3a3432;color:#f3eeeb}
.focus-b{padding:12px;display:grid;place-items:center}
.focus-b canvas{display:block;max-width:calc(100vw - 48px);max-height:calc(100vh - 150px);height:auto;width:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}
.saveimg{max-width:100%;height:auto;display:block;margin:0 auto}
@media (max-width:560px){.top .wrap{gap:8px 10px}.top select.ctl{max-width:150px}.board{gap:30px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<div class="top"><div class="wrap">
  <span class="brand">Carousel <b>Artboard</b></span>
  <label class="sr" for="postSel">Post</label>
  <select id="postSel" class="ctl" hidden></select>
  <button id="newPost" class="btn ghost sm" hidden>New post</button>
  <span class="grow"></span>
  <span id="pill" class="pill" data-s="local"><i></i><span>Loading</span></span>
  <button id="dlAll" class="btn primary" disabled>Download all</button>
</div></div>

<main class="wrap" id="main">
  <div class="empty" id="boot"><h2>Loading your board</h2><p>Fetching slides and photos…</p></div>
</main>

<dialog id="pickDlg" aria-labelledby="pickTitle">
  <div class="dlg-h"><h3 id="pickTitle">Replace image</h3><span class="grow"></span>
    <label class="btn primary sm" id="pickUploadLbl">Upload new photo<input type="file" id="pickUpload" accept="image/*" class="sr"></label>
    <button class="icon" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="dlg-b"><p class="hint" id="pickHint" style="margin:0 0 12px;color:var(--muted)">Pick one of this post's photos. The text design re-fits to the new photo.</p><div class="pick" id="pickGrid"></div></div>
</dialog>

<dialog id="focusDlg" aria-labelledby="focusTitle">
  <div class="dlg-h"><h3 id="focusTitle">Slide</h3><span class="grow"></span>
    <button class="icon" id="fPrev" aria-label="Previous slide"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="icon" id="fNext" aria-label="Next slide"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="icon" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="focus-b"><canvas id="focusCv" width="900" height="1350"></canvas></div>
</dialog>

<dialog id="imgDlg" aria-labelledby="imgTitle">
  <div class="dlg-h"><h3 id="imgTitle">Your PNG</h3><span class="grow"></span>
    <button class="icon" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="dlg-b"><p style="margin:0 0 12px;color:var(--muted)">Downloads aren't available here. Press and hold the image (or right-click it) to save it.</p><img id="imgOut" class="saveimg" alt="Exported slide"></div>
</dialog>

<script>
(() => {
"use strict";
/* ---------- constants & helpers ---------- */
const W = 1800, H = 2700, M = 163, LH = 44.4, FOOT_Y = 2543;
const FONT = '"Nimbus Sans","Helvetica Neue",Helvetica,Arial,sans-serif';
let CAPR = 0.729;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pad2 = n => String(n).padStart(2, "0");
const up = s => String(s ?? "").toUpperCase();
const slug = s => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "slide";
const fill = (s, post) => String(s ?? "").replace(/\{handle\}/gi, (post && post.handle) || "");
const capH = size => CAPR * size;
const ICON = {
  left: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  right: '<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  more: '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>'
};

/* ---------- templates ---------- */
const TEMPLATES = {
  cover: { label: "Cover", slots: ["img"], text: { left: "STEAL", right: "MY", title: "DJI OSMO NANO", sub: "SETTINGS", section: "CAMERA SETUP", foot: "SWIPE FOR MORE" } },
  specs: { label: "Settings", slots: ["img"], text: { section: "SETTINGS", foot: "SAVE FOR LATER", rows: [{ label: "SETTING", value: "VALUE", note: "WHY IT MATTERS" }], tipK: "", tip: "" } },
  beforeafter: { label: "Before / after", slots: ["img", "img2"], text: { aValue: "BEFORE", aLabel: "D-LOG M", aNote: "STRAIGHT OUT OF CAMERA. FLAT ON PURPOSE", bValue: "AFTER", bLabel: "GRADED", bNote: "THE SAME CLIP AFTER THE COLOR GRADE", section: "BEFORE / AFTER", foot: "SAVE FOR LATER" } },
  save: { label: "Save for later", slots: ["img"], text: { left: "DON’T LOSE", right: "THESE", big: "**SAVE** FOR **LATER**", sub: "FOLLOW **{handle}**", section: "CAMERA SETUP", foot: "{handle}" } },
  photo: { label: "Photo", slots: ["img"], text: { label: "", note: "", section: "", foot: "SAVE FOR LATER" } }
};
const FIELDS = {
  cover: [["left", "Small word, left"], ["right", "Small word, right"], ["title", "Title (wrap words in **…** for bold)"], ["sub", "Under the title"], ["section", "Footer, middle"], ["foot", "Footer, right"]],
  specs: [["section", "Footer, middle"], ["foot", "Footer, right"], "ROWS", ["tipK", "Tip heading"], ["tip", "Tip text", "area"]],
  beforeafter: [["aValue", "Top half, big word"], ["aLabel", "Top half, label"], ["aNote", "Top half, note", "area"], ["bValue", "Bottom half, big word"], ["bLabel", "Bottom half, label"], ["bNote", "Bottom half, note", "area"], ["section", "Footer, middle"], ["foot", "Footer, right"]],
  save: [["left", "Small word, left"], ["right", "Small word, right"], ["big", "Big text (**bold**, Enter = new line)", "area"], ["sub", "Under the big text ({handle} = your handle)"], ["section", "Footer, middle"], ["foot", "Footer, right"]],
  photo: [["label", "Caption heading"], ["note", "Caption text", "area"], ["section", "Footer, middle"], ["foot", "Footer, right"]]
};
const SLOT_NAME = { img: "image", img2: "after image" };

/* ---------- text engine (canvas, tracked, kerned) ---------- */
const font = (size, weight) => `${weight} ${size}px ${FONT}`;
const posCache = new Map();
function measureW(ctx, s, size, weight, track) {
  if (!s) return 0;
  ctx.font = font(size, weight);
  const n = Array.from(s).length;
  let extra = 0;
  for (const ch of s) { if (ch === "−") extra += 0.05 * size; else if (ch === "/") extra += 0.025 * size; }
  return ctx.measureText(s).width + (n - 1) * track * size + extra;
}
function positions(ctx, s, size, weight, track) {
  const key = size + "|" + weight + "|" + track + "|" + s;
  let p = posCache.get(key);
  if (p) return p;
  ctx.font = font(size, weight);
  const chars = Array.from(s), xs = [];
  let prefix = "", extra = 0;
  for (let i = 0; i < chars.length; i++) {
    const ch = chars[i];
    const pw = ctx.measureText(prefix + ch).width, cw = ctx.measureText(ch).width;
    xs.push(pw - cw + i * track * size + extra);
    prefix += ch;
    if (ch === "−") extra += 0.05 * size; else if (ch === "/") extra += 0.025 * size;
  }
  p = { chars, xs };
  if (posCache.size > 3000) posCache.clear();
  posCache.set(key, p);
  return p;
}
function parseRich(str, baseW) {
  const out = [];
  String(str).split("**").forEach((t, i) => { if (t) out.push({ t, w: i % 2 ? 700 : baseW }); });
  return out;
}
function richW(ctx, str, size, baseW, track) {
  const segs = parseRich(str, baseW);
  let w = 0;
  segs.forEach((sg, i) => { w += measureW(ctx, sg.t, size, sg.w, track) + (i ? track * size : 0); });
  return w;
}
/* draw text with its cap top at capTop; returns drawn width */
function txt(ctx, str, x, capTop, o) {
  const size = o.size, track = o.track ?? -0.05, baseW = o.weight ?? 700;
  str = String(str ?? "");
  if (!str) return 0;
  const segs = parseRich(str, baseW);
  const widths = segs.map(sg => measureW(ctx, sg.t, size, sg.w, track));
  const total = widths.reduce((a, b) => a + b, 0) + Math.max(0, segs.length - 1) * track * size;
  let x0 = x;
  if (o.align === "right") x0 = x - total; else if (o.align === "center") x0 = x - total / 2;
  ctx.save();
  ctx.fillStyle = o.color || "#ffffff";
  ctx.globalAlpha = o.alpha ?? 1;
  ctx.textBaseline = "alphabetic";
  const base = capTop + capH(size);
  let cx = x0;
  segs.forEach((sg, i) => {
    const p = positions(ctx, sg.t, size, sg.w, track);
    ctx.font = font(size, sg.w);
    p.chars.forEach((ch, j) => { if (ch !== " " && ch !== " ") ctx.fillText(ch, cx + p.xs[j], base); });
    cx += widths[i] + track * size;
  });
  ctx.restore();
  return total;
}
function wrap(ctx, str, maxW, size, weight, track) {
  const words = String(str ?? "").replace(/ \+ /g, "\u00a0+ ").split(/ +/).filter(Boolean);
  if (!words.length) return [];
  const lines = [];
  let cur = words[0];
  for (let i = 1; i < words.length; i++) {
    const test = cur + " " + words[i];
    if (richW(ctx, test, size, weight, track) <= maxW) cur = test; else { lines.push(cur); cur = words[i]; }
  }
  lines.push(cur);
  if (lines.length >= 2) {
    const last = lines[lines.length - 1], prev = lines[lines.length - 2].split(" ");
    if (!last.includes(" ") && prev.length >= 3) {
      const moved = prev.pop(), cand = moved + " " + last;
      if (richW(ctx, cand, size, weight, track) <= maxW) { lines[lines.length - 2] = prev.join(" "); lines[lines.length - 1] = cand; }
    }
  }
  return lines;
}
function rule(ctx, y, x0 = M, x1 = W - M, a = 0.42) {
  ctx.save(); ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillRect(x0, Math.round(y) - 1, x1 - x0, 2); ctx.restore();
}

/* ---------- images ---------- */
const imgCache = new Map();
let onImageReady = () => {};
function srcOf(slot) {
  if (!slot) return null;
  if (slot.asset) return window.__ASSET_URL__ ? window.__ASSET_URL__(slot.asset) : "/_blob/" + slot.asset;
  return slot.file || null;
}
function getImg(slot) {
  const src = srcOf(slot);
  if (!src) return null;
  let e = imgCache.get(src);
  if (!e) {
    e = { img: new Image(), ok: false, err: false };
    imgCache.set(src, e);
    e.img.decoding = "async";
    e.img.onload = () => { e.ok = true; onImageReady(src); };
    e.img.onerror = () => { e.err = true; onImageReady(src); };
    e.img.src = src;
  }
  return e.ok ? e.img : null;
}
function imgState(slot) { const s = srcOf(slot); const e = s && imgCache.get(s); return !s ? "none" : !e ? "loading" : e.ok ? "ok" : e.err ? "error" : "loading"; }
function coverRect(img, rw, rh, slot) {

  else if (act === "delrow") { s.text.rows.splice(+b.dataset.i, 1); saveSlide(sid); renderBoard(new Set([sid])); }
  else if (act === "menu") toggleMenu(b, sid);
  else if (act === "dup") duplicate(sid);
  else if (act === "del") { b.textContent = "Tap again to delete"; b.dataset.act = "delok"; }
  else if (act === "delok") del(sid);
});
function closeMenus() { $$(".menu").forEach(m => { m.previousElementSibling && m.previousElementSibling.setAttribute("aria-expanded", "false"); m.remove(); }); }
function toggleMenu(btn, sid) {
  const open = btn.nextElementSibling;
  closeMenus();
  if (open) return;
  const m = document.createElement("div"); m.className = "menu";
  m.innerHTML = `<button data-act="dup">Duplicate slide</button><button data-act="del" class="danger">Delete slide</button>`;
  btn.after(m); btn.setAttribute("aria-expanded", "true");
}
function move(sid, dir) {
  const o = order(), i = o.indexOf(sid), j = i + dir;
  if (j < 0 || j >= o.length) return;
  [o[i], o[j]] = [o[j], o[i]];
  S.post.order = o; saveMeta(); renderBoard(); renderLibrary();
}
function newId() { return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
function addSlide(type) {
  const sid = newId(), T = TEMPLATES[type];
  S.slides[sid] = { type, text: clone(T.text), layout: {}, status: "review", comment: "" };
  T.slots.forEach(k => { S.slides[sid][k] = null; });
  const o = order().filter(id => id !== sid); const save = o.findIndex(id => S.slides[id].type === "save");
  if (save >= 0 && type !== "save") o.splice(save, 0, sid); else o.push(sid);
  S.post.order = o; saveSlide(sid); saveMeta(); renderBoard();
  document.getElementById("card-" + sid).scrollIntoView({ behavior: "smooth", block: "center" });
}
function duplicate(sid) {
  const nid = newId(); S.slides[nid] = clone(S.slides[sid]); S.slides[nid].status = "review"; S.slides[nid].comment = "";
  const o = order().filter(id => id !== nid); o.splice(o.indexOf(sid) + 1, 0, nid); S.post.order = o; saveSlide(nid); saveMeta(); renderBoard();
}
function del(sid) {
  delete S.slides[sid]; S.post.order = order(); saveMeta(); removeDoc(slidePath(sid)); renderBoard(); renderLibrary();
  toast("Slide deleted");
}
function copyAll(btn) {
  const lines = [`${S.post.title || "Post"}`, "", "Overall: " + (S.post.overall || "(none)"), ""];
  order().forEach((sid, i) => { const s = S.slides[sid]; lines.push(`${pad2(i + 1)} ${slideName(s)} [${{ review: "to review", change: "needs changes", ok: "approved" }[s.status || "review"]}]: ${s.comment || "(no comment)"}`); });
  const text = lines.join("\n");
  const done = () => { btn.textContent = "Copied"; setTimeout(() => (btn.textContent = "Copy all comments"), 1600); };
  try { navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done)); } catch (e) { fallbackCopy(text, done); }
}
function fallbackCopy(text, done) { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) {} ta.remove(); }
let toastT;
function toast(msg) { let t = $(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2400); }

/* ---------- photos ---------- */
let pickFor = null;
function openPicker(sid, slot) {
  pickFor = { sid, slot };
  const s = S.slides[sid];
  $("#pickTitle").textContent = s.type === "beforeafter" ? (slot === "img" ? "Replace before photo" : "Replace after photo") : "Replace image";
  $("#pickUploadLbl").hidden = !(S.assets || S.local);
  $("#pickHint").textContent = (S.assets || S.local) ? "Pick one of this post's photos or upload a new one. The text design re-fits to the photo you choose." : "Pick one of this post's photos. Only editors of this board can upload new ones.";
  $("#pickGrid").innerHTML = libEntries().map((e, i) => `<button data-pick="${i}"><img loading="lazy" src="${esc(srcOf(e))}" alt=""><span>${esc(e.name)}</span></button>`).join("") || `<p>No photos yet. Upload one.</p>`;
  $("#pickDlg").showModal();
}
$("#pickGrid").addEventListener("click", e => { const b = e.target.closest("[data-pick]"); if (b) usePhoto(libEntries()[+b.dataset.pick]); });
function usePhoto(entry) {
  if (!pickFor || !entry) return;
  const { sid, slot } = pickFor, s = S.slides[sid];
  s[slot] = { ...(entry.asset ? { asset: entry.asset } : { file: entry.file }), fx: 0.5, fy: 0.5, zoom: 1 };
  s.layout = {};
  saveSlide(sid);
  $("#pickDlg").close();
  renderBoard(new Set([sid])); renderLibrary();
  toast("Photo replaced. Text re-fitted to it");
}
function imageSize(src) { return new Promise(res => { const im = new Image(); im.onload = () => res([im.naturalWidth, im.naturalHeight]); im.onerror = () => res([0, 0]); im.src = src; }); }
async function uploadFiles(files) {
  const added = [];
  for (const f of files) {
    if (!/^image\/(png|jpeg|webp|gif)$/.test(f.type)) { toast(`${f.name}: use a JPG, PNG or WebP photo`); continue; }
    toast(`Uploading ${f.name}…`);
    try {
      let entry;
      if (S.assets) { const r = await S.assets.upload(f); const [w, h] = await imageSize(r.url); entry = { asset: r.id, name: f.name, w, h }; }
      else { const url = URL.createObjectURL(f); const [w, h] = await imageSize(url); entry = { file: url, name: f.name, w, h }; }
      S.post.library = [...libEntries(), entry]; added.push(entry);
    } catch (e) {
      const why = { too_large: "it's over 20 MB", unsupported_type: "that file type isn't supported", quota_or_state: "the board's storage is full", rate_limited: "too many uploads at once, try again in a moment" }[e && e.code] || "the upload failed";
      toast(`${f.name} wasn't added: ${why}`);
    }
  }
  if (added.length) { saveMeta(); renderLibrary(); toast(`${added.length} photo${added.length > 1 ? "s" : ""} added`); if ($("#pickDlg").open) openPicker(pickFor.sid, pickFor.slot); }
  return added;
}

/* ---------- focus view ---------- */
let focusSid = null;
function openFocus(sid) { focusSid = sid; const dlg = $("#focusDlg"); if (!dlg.open) dlg.showModal(); drawFocus(); }
$("#focusDlg").addEventListener("close", () => { focusSid = null; });
function drawFocus() {
  const s = S.slides[focusSid]; if (!s) return;
  const o = order(), i = o.indexOf(focusSid), dpr = window.devicePixelRatio || 1;
  const sc = clamp(Math.min((innerWidth - 48) * dpr / W, (innerHeight - 150) * dpr / H), 0.2, 1);
  const cv = $("#focusCv"); cv.width = Math.round(W * sc); cv.height = Math.round(H * sc);
  cv.style.width = Math.round(W * sc / dpr) + "px"; cv.style.height = Math.round(H * sc / dpr) + "px";
  renderSlide(cv, S.post, s, i + 1, o.length, sc);
  $("#focusTitle").textContent = `${pad2(i + 1)}/${pad2(o.length)} ${slideName(s)}`;
}
function stepFocus(d) { const o = order(), i = o.indexOf(focusSid); const j = clamp(i + d, 0, o.length - 1); if (j !== i) { focusSid = o[j]; drawFocus(); } }
document.addEventListener("keydown", e => { if (!$("#focusDlg").open) return; if (e.key === "ArrowLeft") stepFocus(-1); if (e.key === "ArrowRight") stepFocus(1); });

/* ---------- export ---------- */
function waitImages(s) {
  return Promise.all(["img", "img2"].map(k => new Promise(res => {
    const src = srcOf(s[k]); if (!src) return res();
    getImg(s[k]); const e = imgCache.get(src);
    if (e.ok || e.err) return res();
    e.img.addEventListener("load", res, { once: true }); e.img.addEventListener("error", res, { once: true });
  })));
}
async function slideBlob(sid) {
  const s = S.slides[sid], o = order();
  await waitImages(s);
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  renderSlide(cv, S.post, s, o.indexOf(sid) + 1, o.length, 1);
  const blob = await new Promise(res => cv.toBlob(res, "image/png"));
  cv.width = cv.height = 1;
  return blob;
}
const fileName = sid => `${pad2(order().indexOf(sid) + 1)}-${slug(slideName(S.slides[sid]))}.png`;
async function offer(filename, blob) {
  if (S.downloads) {
    try { await S.downloads.save({ filename, data: blob }); return true; }
    catch (e) { if (e && e.code === "declined") return false; if (e && e.code === "rate_limited") { toast("Another download is waiting for you to confirm"); return false; } }
  }
  if (/\.png$/.test(filename)) { $("#imgOut").src = URL.createObjectURL(blob); $("#imgTitle").textContent = filename; $("#imgDlg").showModal(); return true; }
  toast("Downloads aren't available here. Use PNG on each slide instead");
  return false;
}
async function exportOne(sid) { toast("Rendering PNG…"); const blob = await slideBlob(sid); if (blob) offer(fileName(sid), blob); }
async function exportAll() {
  const o = order(), btn = $("#dlAll");
  btn.disabled = true;
  try {
    if (!window.JSZip) { toast("ZIP isn't available. Use PNG on each slide"); return; }
    const zip = new window.JSZip();
    for (let i = 0; i < o.length; i++) { btn.textContent = `Rendering ${i + 1}/${o.length}`; zip.file(fileName(o[i]), await slideBlob(o[i])); }
    btn.textContent = "Zipping…";
    const blob = await zip.generateAsync({ type: "blob" });
    await offer(`${slug(S.post.title)}.zip`, blob);
  } finally { btn.textContent = "Download all"; btn.disabled = false; }
}
window.__exportPNG = async i => { const sid = order()[i]; const blob = await slideBlob(sid); return await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); }); };
window.__debugDesign = i => { const sid = order()[i]; const cv = document.createElement("canvas"); cv.width = 60; cv.height = 90; const d = renderSlide(cv, S.post, S.slides[sid], i + 1, order().length, 60 / W); return { note: d.note, mode: d.mode, pos: d.pos, stTop: d.stTop, stBot: d.stBot, tip: d.tip && { mode: d.tip.mode, side: d.tip.side, w: d.tip.w, st: d.tip.st } }; };
window.__stats = (i, slot, x0, y0, x1, y1, rh) => { const s = S.slides[order()[i]]; const A = analyze(s[slot || "img"], W, rh || H); return A && A.stats(x0, y0, x1, y1); };

/* ---------- posts ---------- */
function selectPost(pid) {
  if (S.unsubSlides) { S.unsubSlides(); S.unsubSlides = null; }
  S.pid = pid; S.slides = {};
  const p = S.posts.find(x => x.id === pid); S.post = clone(p ? p.data : {}) || {};
  renderMain();
  if (S.local) { Object.assign(S.slides, clone((window.__LOCAL_STATE__.slides || {})[pid] || {})); renderBoard(new Set(Object.keys(S.slides))); renderLibrary(); return; }
  S.unsubSlides = S.db.collection(`posts/${pid}/slides`).onSnapshot(snap => {
    const seen = new Set(), changed = new Set();
    for (const d of snap.docs) {
      seen.add(d.id);
      if (S.dirty.has(slidePath(d.id)) || S.writing.has(slidePath(d.id))) continue;
      const data = d.data();
      if (!data || !TEMPLATES[data.type]) continue;
      if (!S.slides[d.id] || JSON.stringify(stripTs(S.slides[d.id])) !== JSON.stringify(stripTs(data))) { S.slides[d.id] = clone(data); changed.add(d.id); }
    }
    for (const id of Object.keys(S.slides)) if (!seen.has(id) && !S.dirty.has(slidePath(id)) && !S.writing.has(slidePath(id))) { delete S.slides[id]; changed.add(id); }
    if (changed.size) { renderBoard(changed); renderLibrary(); }
  }, err => { console.warn(err); S.errors++; setStatus(); });
}
const stripTs = o => { const c = { ...o }; delete c.updatedAt; return c; };
function newPost() {
  const pid = "post-" + Date.now().toString(36);
  const meta = { title: "New carousel", series: S.post ? S.post.series : "STEAL MY SETTINGS", subject: S.post ? S.post.subject : "", handle: S.post ? S.post.handle : "", library: [], order: [], overall: "", updatedAt: Date.now() };
  S.posts.push({ id: pid, data: meta });
  selectPost(pid);
  ["cover", "specs", "save"].forEach(t => addSlide(t));
  saveMeta();
  renderMeta();
  toast("New post started. Add photos and edit the text");
}
async function boot() {
  try { await Promise.all([document.fonts.load(`700 40px "Nimbus Sans"`), document.fonts.load(`400 40px "Nimbus Sans"`)]); } catch (e) {}
  try { const c = document.createElement("canvas").getContext("2d"); c.font = font(1000, 700); const m = c.measureText("H"); if (m.actualBoundingBoxAscent > 500) CAPR = m.actualBoundingBoxAscent / 1000; } catch (e) {}
  if (window.__LOCAL_STATE__) {
    S.local = true; S.posts = clone(window.__LOCAL_STATE__.posts || []);
    setStatus();
    if (S.posts[0]) selectPost(S.posts[0].id);
    return;
  }
  const claude = window.claude;
  if (!claude || typeof claude.use !== "function") { $("#boot").innerHTML = `<h2>Open this board in Claude</h2><p>Your slides and comments load when this page is opened from claude.ai.</p>`; $("#pill").hidden = true; return; }
  const [db, assets, downloads] = await Promise.all(["db", "assets", "downloads"].map(n => claude.use(n).catch(() => null)));
  S.db = db; S.assets = assets; S.downloads = downloads;
  if (!db) { $("#boot").innerHTML = `<h2>Sign in to see this board</h2><p>Slides and comments are stored with this board. Sign in to claude.ai with an account that has access.</p>`; $("#pill").hidden = true; return; }
  setStatus();
  db.collection("posts").onSnapshot(snap => {
    S.posts = snap.docs.map(d => ({ id: d.id, data: d.data() })).filter(p => p.data);
    if (!S.posts.length && !S.pid) {
      $("#main").innerHTML = `<div class="empty"><h2>No posts yet</h2><p>Start one here, or ask Claude to set up your next carousel.</p><p><button class="btn primary" id="newPost2">Start a post</button></p></div>`;
      $("#newPost2").onclick = newPost; renderMeta(); return;
    }
    const cur = S.posts.find(p => p.id === S.pid);
    if (!cur) { const pick = [...S.posts].sort((a, b) => (b.data.updatedAt || 0) - (a.data.updatedAt || 0))[0]; if (pick) selectPost(pick.id); }
    else if (!S.dirty.has(metaPath()) && !S.writing.has(metaPath()) && JSON.stringify(stripTs(cur.data)) !== JSON.stringify(stripTs(S.post))) {
      S.post = clone(cur.data); renderMeta(); renderBoard(); renderLibrary(); scheduleDraw();
    }
    renderMeta();
  }, err => { console.warn(err); $("#boot") && ($("#boot").innerHTML = `<h2>Couldn’t load your posts</h2><p>Reload the page to try again.</p>`); });
}
boot();
})();
</script>
