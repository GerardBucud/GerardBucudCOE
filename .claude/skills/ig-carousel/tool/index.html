<title>Carousel Artboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a light table. The post's artboards sit in swipe order; each frame carries its own controls and review note underneath. */
:root{
  --bg:#ecebea; --surface:#ffffff; --sunken:#e3e0de; --ink:#1a1615; --muted:#625a57; --line:#d2cbc7;
  --accent:#cf2a14; --accent-ink:#ffffff; --focus:#2257d6;
  --st-review:#6a615d; --st-change:#9e4507; --st-ok:#15704a;
  --frame:#0f0c0b;
  --ui:"Nimbus Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131111; --surface:#1c1918; --sunken:#0e0c0c; --ink:#f3eeeb; --muted:#a8a09c; --line:#342f2d;
  --accent:#ff5b3e; --accent-ink:#1b0d0a; --focus:#8db2ff;
  --st-review:#a8a09c; --st-change:#f2a35e; --st-ok:#5fc592; --frame:#000000; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131111; --surface:#1c1918; --sunken:#0e0c0c; --ink:#f3eeeb; --muted:#a8a09c; --line:#342f2d;
  --accent:#ff5b3e; --accent-ink:#1b0d0a; --focus:#8db2ff;
  --st-review:#a8a09c; --st-change:#f2a35e; --st-ok:#5fc592; --frame:#000000; color-scheme:dark}

@font-face{font-family:"Nimbus Sans";src:url("fonts/NimbusSans-Regular.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Nimbus Sans";src:url("fonts/NimbusSans-Bold.otf") format("opentype");font-weight:700;font-style:normal;font-display:swap}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:12px}
.brand{font-weight:700;letter-spacing:-.04em;text-transform:uppercase;font-size:17px;white-space:nowrap}
.brand b{color:var(--accent)}
.grow{flex:1 1 auto}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--st-ok)}
.pill[data-s="saving"] i{background:var(--st-change)}
.pill[data-s="error"] i,.pill[data-s="readonly"] i{background:var(--accent)}
.pill[data-s="local"] i{background:var(--st-review)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
select.ctl,input.ctl,textarea.ctl{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;font-size:14px}
textarea.ctl{min-height:64px;resize:vertical;line-height:1.35}
.top select.ctl{width:auto;max-width:260px}
.lbl{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:5px}

/* post settings */
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 16px;padding-block:18px 6px}
.meta .full{grid-column:1/-1}
h1.title{font-size:clamp(26px,4vw,40px);line-height:1.02;letter-spacing:-.05em;text-transform:uppercase;margin:22px 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:70ch}

/* board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:34px 26px;padding-block:26px}
.card{min-width:0;display:flex;flex-direction:column;gap:10px}
.card-h{display:flex;align-items:center;gap:10px}
.num{font-weight:700;font-size:22px;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.num span{color:var(--muted);font-weight:400;letter-spacing:-.04em}
.kind{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.card-tools{margin-left:auto;display:flex;gap:6px}
.icon{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0}
.icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.frame{display:block;width:100%;padding:0;border:0;background:var(--frame);border-radius:4px;overflow:hidden;cursor:zoom-in;aspect-ratio:2/3;max-width:100%}
.frame canvas{display:block;width:100%;height:100%}
.autonote{font-size:12.5px;color:var(--muted);min-height:1.4em}
.autonote b{color:var(--ink);font-weight:700}
.warn{font-size:12.5px;color:var(--st-change)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.status{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.status button{flex:1;min-height:36px;border:0;background:transparent;cursor:pointer;font-size:13px;color:var(--muted);padding:0 6px}
.status button+button{border-left:1px solid var(--line)}
.status button[aria-pressed="true"][data-v="review"]{background:var(--sunken);color:var(--ink);font-weight:700}
.status button[aria-pressed="true"][data-v="change"]{background:var(--st-change);color:#fff;font-weight:700}
.status button[aria-pressed="true"][data-v="ok"]{background:var(--st-ok);color:#fff;font-weight:700}
.card[data-st="change"] .frame{box-shadow:0 0 0 3px var(--st-change)}
.card[data-st="ok"] .frame{box-shadow:0 0 0 3px var(--st-ok)}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:700;font-size:14px;min-height:32px;display:flex;align-items:center}
.fields{display:grid;gap:10px;padding:8px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rowbox{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px;background:var(--sunken)}
.rowbox .two{grid-template-columns:1.2fr .8fr}
.rowhead{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.range{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.range input{width:100%}
.range output{font-size:12px;color:var(--muted);min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.more{position:relative}
.menu{position:absolute;right:0;top:40px;z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px;display:grid;min-width:170px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.menu button{text-align:left;background:none;border:0;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:14px}
.menu button:hover{background:var(--sunken)}
.menu .danger{color:var(--accent)}

/* sections */
.section{border-top:1px solid var(--line);padding-block:26px}
.section h2{font-size:22px;letter-spacing:-.05em;text-transform:uppercase;margin:0 0 6px}
.section p.hint{color:var(--muted);margin:0 0 14px;max-width:70ch}
.overall{display:grid;gap:12px;max-width:820px}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:26px;letter-spacing:-.05em;text-transform:uppercase;margin:0 0 8px}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;max-width:min(960px,calc(100vw - 24px));width:100%}
dialog::backdrop{background:rgba(10,8,8,.6)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg-h h3{margin:0;font-size:17px;letter-spacing:-.03em;text-transform:uppercase}
.dlg-b{padding:16px;max-height:70vh;overflow:auto}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.pick button{border:2px solid transparent;border-radius:8px;padding:0;background:none;cursor:pointer;text-align:left;display:grid;gap:4px;font-size:12px;color:var(--muted)}
.pick button:hover{border-color:var(--accent)}
.pick img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:6px;display:block;background:var(--sunken)}
.pick span{padding:0 4px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#focusDlg{max-width:none;width:auto;background:#0b0909;border-color:#2a2524;color:#f3eeeb}
#focusDlg .dlg-h{border-color:#2a2524}
#focusDlg .icon,#focusDlg .btn{background:#1c1918;border-color:#3a3432;color:#f3eeeb}
.focus-b{padding:12px;display:grid;place-items:center}
.focus-b canvas{display:block;max-width:calc(100vw - 48px);max-height:calc(100vh - 150px);height:auto;width:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}
.saveimg{max-width:100%;height:auto;display:block;margin:0 auto}

.btn.accent{border-color:var(--accent);color:var(--accent);font-weight:700;background:var(--surface)}
.btn.danger{color:var(--accent)}
.top .wrap{position:relative}
.applybar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.applied{font-size:13.5px;line-height:1.4;background:var(--sunken);border-radius:8px;padding:10px 12px;display:grid;gap:8px}
.applied p{margin:0}
.busy{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:10px}
.busy i{flex:0 0 auto;width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse .9s infinite alternate}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
.notes{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;margin-top:18px;display:flex;gap:12px;align-items:flex-start}
.notes p{margin:0;flex:1;min-width:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:0 0 auto}
.check small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.sec-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px}
.sec-h h2{margin:0}
.libwrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}
.folders{display:grid;gap:2px;align-content:start}
.folders button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:0;background:none;border-radius:6px;padding:8px 10px;cursor:pointer;font-size:14px;color:var(--ink);min-height:36px;align-items:center}
.folders button span{color:var(--muted);font-variant-numeric:tabular-nums}
.folders button[aria-current="true"]{background:var(--surface);font-weight:700;box-shadow:inset 0 0 0 1px var(--line)}
.libmain{min-width:0;display:grid;gap:12px}
.seltools,.foldertools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seltools{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.seltools .count{font-weight:700;font-size:14px;margin-right:4px}
.seltools select.ctl,.seltools input.ctl,.foldertools input.ctl{width:auto;min-width:170px;flex:0 1 240px}
.foldertools .path{font-weight:700;font-size:15px;letter-spacing:-.02em;margin-right:6px}
.inline-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 14px}
.inline-form input.ctl{width:auto;min-width:200px;flex:1 1 200px;max-width:360px}
.inline-form .hint{margin:0;color:var(--muted);font-size:13px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.tile{position:relative;display:grid;gap:4px;min-width:0;border:0;background:none;padding:0;text-align:left;cursor:pointer;font-size:12px;color:var(--muted)}
.tile img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:var(--sunken);display:block;outline:3px solid transparent;outline-offset:-3px}
.tile[aria-pressed="true"] img{outline-color:var(--accent)}
.tile .tick{position:absolute;top:6px;left:6px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.tile[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent)}
.tile .nm{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .use{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap;min-height:34px}
.chips button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:760px){.libwrap{grid-template-columns:1fr}.folders{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}.folders button{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:var(--surface);white-space:nowrap}}
.adjgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.stickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.stickgrid button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;display:grid;gap:6px;cursor:pointer;font-size:13px;color:var(--ink);text-align:center}
.stickgrid button:hover{border-color:var(--accent)}
.stickgrid canvas{width:100%;height:auto;border-radius:6px;display:block}
#focusCv{touch-action:none}
.guide{display:grid;gap:14px;max-width:860px}
.gbox{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;background:var(--surface)}
.gbox .rowhead{gap:8px}
@media (max-width:560px){.top .wrap{gap:8px 10px}.top select.ctl{max-width:150px}.board{gap:30px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.busy i{animation:none}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<div class="top"><div class="wrap">
  <span class="brand">Carousel <b>Artboard</b></span>
  <label class="sr" for="postSel">Post</label>
  <select id="postSel" class="ctl" hidden></select>
  <div class="more"><button id="newPost" class="btn ghost sm" hidden aria-expanded="false">New post</button></div>
  <span class="grow"></span>
  <span id="pill" class="pill" data-s="local"><i></i><span>Loading</span></span>
  <button id="applyAll" class="btn accent" hidden disabled>Apply comments</button>
  <button id="dlAll" class="btn primary" disabled>Download all</button>
</div></div>

<main class="wrap" id="main">
  <div class="empty" id="boot"><h2>Loading your board</h2><p>Fetching slides and photos…</p></div>
</main>

<dialog id="pickDlg" aria-labelledby="pickTitle">
  <div class="dlg-h"><h3 id="pickTitle">Replace image</h3><span class="grow"></span>
    <label class="btn primary sm" id="pickUploadLbl">Upload new photo<input type="file" id="pickUpload" accept="image/*" class="sr"></label>
    <button class="icon" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="dlg-b"><p id="pickHint" style="margin:0 0 12px;color:var(--muted)">Pick a photo from your library. The text design re-fits to the photo you choose.</p>
    <div class="chips" id="pickFolders" aria-label="Folders"></div><div class="pick" id="pickGrid"></div></div>
</dialog>

<dialog id="stickDlg" aria-labelledby="stickTitle">
  <div class="dlg-h"><h3 id="stickTitle">Add a sticker</h3><span class="grow"></span>
    <button class="icon" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="dlg-b"><div class="stickgrid" id="stickGrid"></div></div>
</dialog>

<dialog id="focusDlg" aria-labelledby="focusTitle">
  <div class="dlg-h"><h3 id="focusTitle">Slide</h3><span class="grow"></span>
    <button class="icon" id="fPrev" aria-label="Previous slide"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="icon" id="fNext" aria-label="Next slide"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="icon" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="focus-b"><canvas id="focusCv" width="900" height="1350"></canvas></div>
</dialog>

<dialog id="imgDlg" aria-labelledby="imgTitle">
  <div class="dlg-h"><h3 id="imgTitle">Your PNG</h3><span class="grow"></span>
    <button class="icon" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="dlg-b"><p style="margin:0 0 12px;color:var(--muted)">Downloads aren't available here. Press and hold the image (or right-click it) to save it.</p><img id="imgOut" class="saveimg" alt="Exported slide"></div>
</dialog>

<script>
(() => {
"use strict";
/* ---------- constants & helpers ---------- */
const W = 1800, H = 2700, M = 163, LH = 44.4, FOOT_Y = 2543;
const FONT = '"Nimbus Sans","Helvetica Neue",Helvetica,Arial,sans-serif';
let CAPR = 0.729;

};

/* ---------- templates ---------- */
const TEMPLATES = {
  cover: { label: "Cover", slots: ["img"], text: { left: "STEAL", right: "MY", title: "DJI OSMO NANO", sub: "SETTINGS", section: "CAMERA SETUP", foot: "SWIPE FOR MORE" } },
  specs: { label: "Settings", slots: ["img"], text: { section: "SETTINGS", foot: "SAVE FOR LATER", rows: [{ label: "SETTING", value: "VALUE", note: "WHY IT MATTERS" }], tipK: "", tip: "" } },
  beforeafter: { label: "Before / after", slots: ["img", "img2"], text: { aValue: "BEFORE", aLabel: "D-LOG M", aNote: "STRAIGHT OUT OF CAMERA. FLAT ON PURPOSE", bValue: "AFTER", bLabel: "GRADED", bNote: "THE SAME CLIP AFTER THE COLOR GRADE", section: "BEFORE / AFTER", foot: "SAVE FOR LATER" } },
  save: { label: "Save for later", slots: ["img"], text: { left: "DON’T LOSE", right: "THESE", big: "**SAVE** FOR **LATER**", sub: "FOLLOW **{handle}**", section: "CAMERA SETUP", foot: "{handle}" } },
  photo: { label: "Photo", slots: ["img"], text: { label: "", note: "", section: "", foot: "SAVE FOR LATER" } }
};
const FIELDS = {

const RULES = `You are editing slides of an Instagram carousel for a creator. Apply the creator's review comments and reply with JSON only.

How to edit:
- Do what each comment asks and nothing more. Copy every field you don't change exactly as it is.
- All copy is UPPERCASE, short and plain. A settings row has a label (what it is), a value (the setting itself, short, like "1/50", "24FPS", "D-LOG M") and a note (one line on why, 4 to 12 words).
- Use the creator's own numbers, names and spellings. Never invent a camera setting or a fact.
- A "specs" slide holds at most 4 rows. When a comment needs more than fits, add a new slide in "newSlides" instead of squeezing.
- tipK is a short tip heading (like "PRO TIP" or "SHOOTING AT NIGHT?"); tip is one or two short sentences.
- **WORD** makes a word bold. {handle} prints the creator's handle. In a "save" slide's big text, a line break starts a new line.
- Write ranges with an en dash (100–1600) and negative numbers with a minus sign (−0.3).
- Change a slide's photo only when a comment asks for a different photo, choosing from the photo library by id. A new photo resets the layout to auto-fit.
- Set "overlay" to true when the creator wants a text-only transparent PNG to lay over a video; the photo is then left out of that slide.

Text fields for each slide type:
cover: left, right, title, sub, section, foot
specs: section, foot, rows [{label, value, note}], tipK, tip
beforeafter: aValue, aLabel, aNote, bValue, bLabel, bNote, section, foot
save: left, right, big, sub, section, foot
photo: label, note, section, foot
(section is the footer's middle text, foot is the footer's right text.)

Layout (change only when a comment asks about placement): pos top|middle|bottom, style overlay|panel (specs only), tip left|right|inline (specs only), panel black|red (specs only), scrim 0 to 0.9 (how much to darken behind text). "auto" puts everything back to auto-fit.

Stickers are icons and buttons drawn on top of a slide. "stickers" is the slide's list of {kind, x, y, size, rot, color, solid, label, bg}:
- kind: bookmark, heart, comment, share, bell, like, arrow (icons); follow, subscribe, save, keyword, handle (pill buttons showing a label); actions (an Instagram-style row of heart, comment and share with a bookmark on the right).
- x and y: the sticker's centre as a fraction of the slide's width and height (0 to 1). The header sits near y 0.06 and the footer near y 0.95; keep stickers clear of text and of the main subject.
- size: pixels on the 1800x2700 slide (icons 120 to 240, buttons 80 to 110 tall). rot: degrees (-45 to 45). color: hex (icons default #FFFFFF; for buttons it is the text color). solid: true fills an icon. label: button text in UPPERCASE. bg: the button's hex color.

Photo edits are the slider settings on a slide's photo. "edits" is {exposure, contrast, whites, blacks, saturation, vibrance, grain, sharpen} for the photo ("edits2" for the after photo of a beforeafter slide): whole numbers from -100 to 100 (grain and sharpen 0 to 100); 0 or missing means unchanged. A light touch is 10 to 25, a clear change 30 to 50. There is no white balance, temperature or tint control; if a comment asks for one, say so in notes.
Return "edits": "keep" unless a comment asks to change how the photo looks; then return the complete new object.`;

const GUIDE_RULES = `You write and edit a short PDF guide that expands an Instagram carousel. Followers get it after commenting a keyword, so it should feel like a bonus: the same settings with more explanation, practical tips and the reasoning behind each choice.
Rules:
- Use the creator's own settings, numbers and spellings exactly as they appear on the slides. Never invent a camera setting, a menu path or a product feature you aren't sure of.
- Write in the creator's voice: friendly, direct, first person, plain words. Sentence case for text and points; headings in UPPERCASE.
- Keep it tight: intro 2 to 3 sentences; each section a 1 to 3 sentence text and 3 to 6 points; closing 1 to 3 sentences.
- Points: one per line, each starting with a short bold lead-in in **...** followed by a colon, then one or two sentences.
- Link each section to the slide it explains by slide id, or null for a section without a slide. Skip the cover and the final call-to-action slide.
- Write ranges with an en dash (100–1600) and negative numbers with a minus sign (−0.3).`;

{"title":"...","subtitle":"...","intro":"...","sections":[{"id":"<keep an existing id, or omit for a new section>","slide":"<slide id or null>","heading":"...","body":"...","points":"**Lead:** sentence.\\n**Lead:** sentence."}],"outro":"...","cta":"...","summary":"<what you changed, one sentence>","notes":"<anything you couldn't do, or empty>"}`;

  }

  const specs = o.filter(sid => S.slides[sid].type === "specs");
  if (g.cheatsheet !== false && specs.length) {
    newPage(); label("Save this page"); heading("Cheat sheet", 24);
    for (const sid of specs) {
      const t = S.slides[sid].text || {};
      ensure(36); draw(up(t.section || ""), MX, y - 8, B, 9, C.accent, -0.35); y -= 14;
      for (const r of (t.rows || [])) {
        ensure(24); rule(); y -= 2;
        draw(up(r.label || ""), MX, y - 14, B, 8, C.ink, -0.32);
        const v = up(r.value || ""); draw(v, PW - MX - tw(v, B, 15, -0.75), y - 16, B, 15, C.ink, -0.75);
        y -= 22;
      }
      if (t.tipK || t.tip) { ensure(26); rule(); y -= 11; para(`**${plain(up(t.tipK || "Tip"))}** ${t.tip || ""}`, 8.5, 12, C.muted); }
      y -= 6;
    }
  }
  // closing
  newPage();
  label("That’s it");
  heading(fill(g.cta || "FOLLOW {handle}", post), 30);
  para(g.outro, 11.5, 16.5, C.ink);
  const last = o[o.length - 1];
  if (last && S.slides[last].type === "save" && !slidePages.has(last)) await slidePage(last);
  onStep && onStep("Saving");
  return await doc.save();
}
async function downloadGuidePdf(btn) {
  if (!S.guide) return;
  const label = btn.textContent; btn.disabled = true;
  try {
    const bytes = await buildGuidePdf(s => { btn.textContent = s + "…"; });
    const blob = new Blob([bytes], { type: "application/pdf" });
    const name = `${slug(plain(S.guide.title) || S.post.title)}-guide.pdf`;
    if (S.downloads) {
      try { await S.downloads.save({ filename: name, data: blob }); }
      catch (e) {
        if (e && e.code === "extension_not_enabled") toast("PDF downloads are turned off here. Ask Claude in the chat for the file.");
        else if (e && e.code !== "declined") toast("Couldn’t save the PDF. Try again.");
      }
    } else toast("Downloads aren't available here. Ask Claude in the chat for the file.");
  } catch (e) { console.warn(e); toast("Couldn’t build the PDF. Check your connection and try again."); }
  finally { btn.textContent = label; btn.disabled = false; }
}
window.__guidePDF = async () => { const bytes = await buildGuidePdf(); let s = ""; for (let i = 0; i < bytes.length; i += 32768) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768)); return btoa(s); };

/* ---------- posts ---------- */
function selectPost(pid) {
  if (S.unsubSlides) { S.unsubSlides(); S.unsubSlides = null; }
  S.pid = pid; S.slides = {}; S.notes = "";
  const p = S.posts.find(x => x.id === pid); S.post = clone(p ? p.data : {}) || {};
  renderMain();
  subscribeGuide(pid);
  if (S.local) { Object.assign(S.slides, clone((window.__LOCAL_STATE__.slides || {})[pid] || {})); renderBoard(new Set(Object.keys(S.slides))); renderLibrary(); return; }
  S.unsubSlides = S.db.collection(`posts/${pid}/slides`).onSnapshot(snap => {
    const seen = new Set(), changed = new Set();
    for (const d of snap.docs) {
      seen.add(d.id);
      if (S.dirty.has(slidePath(d.id)) || S.writing.has(slidePath(d.id)) || S.busy.has(d.id)) continue;
      const data = d.data();
      if (!data || !TEMPLATES[data.type]) continue;
      if (!S.slides[d.id] || JSON.stringify(stripTs(S.slides[d.id])) !== JSON.stringify(stripTs(data))) { S.slides[d.id] = clone(data); changed.add(d.id); }
    }
    for (const id of Object.keys(S.slides)) if (!seen.has(id) && !S.dirty.has(slidePath(id)) && !S.writing.has(slidePath(id))) { delete S.slides[id]; changed.add(id); }
    if (changed.size) { renderBoard(changed); renderLibrary(); }
  }, err => { console.warn(err); S.errors++; setStatus(); });
}
const stripTs = o => { const c = { ...o }; delete c.updatedAt; return c; };
function newPost(mode) {
  const pid = "post-" + Date.now().toString(36), base = S.post || {};
  const meta = { title: mode === "copy" ? `${base.title || "Post"} (copy)` : "New carousel", series: base.series || "STEAL MY SETTINGS", subject: base.subject || "", handle: base.handle || "", order: [], overall: "", updatedAt: Date.now() };
  const copies = mode === "copy" ? order().map(sid => { const c = clone(S.slides[sid]); delete c.undo; delete c.applied; c.comment = ""; c.status = "review"; return c; }) : null;
  S.posts.push({ id: pid, data: meta });
  selectPost(pid);
  if (copies) { copies.forEach(c => { const sid = newId(); S.slides[sid] = c; S.post.order.push(sid); saveSlide(sid); }); renderBoard(new Set(Object.keys(S.slides))); }
  else ["cover", "specs", "save"].forEach(t => addSlide(t, true));
  saveMeta(); renderMeta(); renderLibrary();
  window.scrollTo({ top: 0 });
  toast(mode === "copy" ? "Copy made. Swap photos and edit the text" : "New post started. Pick photos from your library");
}
async function deletePost(btn) {
  if (btn.dataset.armed !== "1") {
    btn.dataset.armed = "1"; btn.textContent = "Tap again to delete this post and its slides";
    setTimeout(() => { if (btn.isConnected) { btn.dataset.armed = ""; btn.textContent = "Delete this post"; } }, 5000);
    return;
  }
  const pid = S.pid, sids = Object.keys(S.slides);
  if (S.unsubSlides) { S.unsubSlides(); S.unsubSlides = null; }
  for (const sid of sids) await removeDoc(`posts/${pid}/slides/${sid}`);
  await removeDoc(`posts/${pid}`);
  S.posts = S.posts.filter(p => p.id !== pid); S.pid = null; S.post = null; S.slides = {};
  if (S.posts[0]) selectPost(S.posts[0].id); else renderEmpty();
  toast("Post deleted. Its photos stay in your library");
}
function renderEmpty() {
  $("#main").innerHTML = `<div class="empty"><h2>No posts yet</h2><p>Start one here, or ask Claude to set up your next carousel.</p><p><button class="btn primary" data-newpost="blank">Start a post</button></p></div>`;
  renderMeta(); updateApplyAll();
}
async function boot() {
  try { await Promise.all([document.fonts.load(`700 40px "Nimbus Sans"`), document.fonts.load(`400 40px "Nimbus Sans"`)]); } catch (e) {}
  try { const c = document.createElement("canvas").getContext("2d"); c.font = font(1000, 700); const m = c.measureText("H"); if (m.actualBoundingBoxAscent > 500) CAPR = m.actualBoundingBoxAscent / 1000; } catch (e) {}
  if (window.__LOCAL_STATE__) {
    const L = window.__LOCAL_STATE__;
    S.local = true; S.posts = clone(L.posts || []); S.sample = window.__FAKE_SAMPLE__ || null;
    (L.photos || []).forEach(([id, p]) => S.photos.set(id, clone(p))); S.folders = clone(L.folders || []);
    setStatus();
    if (S.posts[0]) selectPost(S.posts[0].id);
    return;
  }
  const claude = window.claude;
  if (!claude || typeof claude.use !== "function") { $("#boot").innerHTML = `<h2>Open this board in Claude</h2><p>Your slides and comments load when this page is opened from claude.ai.</p>`; $("#pill").hidden = true; return; }
  const [db, assets, downloads, sample] = await Promise.all(["db", "assets", "downloads", "sample"].map(n => claude.use(n).catch(() => null)));
  S.db = db; S.assets = assets; S.downloads = downloads; S.sample = sample;
  if (!db) { $("#boot").innerHTML = `<h2>Sign in to see this board</h2><p>Slides and comments are stored with this board. Sign in to claude.ai with an account that has access.</p>`; $("#pill").hidden = true; return; }
  setStatus();
  db.collection("photos").onSnapshot(snap => {
    const seen = new Set();
    for (const d of snap.docs) { seen.add(d.id); if (S.dirty.has(photoPath(d.id)) || S.writing.has(photoPath(d.id))) continue; const v = d.data(); if (v) S.photos.set(d.id, clone(v)); }
    for (const id of [...S.photos.keys()]) if (!seen.has(id) && !S.dirty.has(photoPath(id)) && !S.writing.has(photoPath(id))) S.photos.delete(id);
    renderLibrary(); if ($("#pickDlg").open) renderPicker();
  }, err => console.warn(err));
  db.doc(LIB_PATH).onSnapshot(snap => {
    if (S.dirty.has(LIB_PATH) || S.writing.has(LIB_PATH)) return;
    const v = snap.exists ? snap.data() : null; S.folders = v && Array.isArray(v.folders) ? clone(v.folders) : [];
    renderLibrary();
  }, err => console.warn(err));
  db.collection("posts").onSnapshot(snap => {
    S.posts = snap.docs.map(d => ({ id: d.id, data: d.data() })).filter(p => p.data);
    const cur = S.posts.find(p => p.id === S.pid);
    if (!S.posts.length && !S.pid) { renderEmpty(); return; }
    if (!cur) {
      if (S.pid && (S.dirty.has(metaPath()) || S.writing.has(metaPath()))) { renderMeta(); return; }
      const pick = [...S.posts].sort((a, b) => (b.data.updatedAt || 0) - (a.data.updatedAt || 0))[0]; if (pick) selectPost(pick.id);
    } else if (!S.dirty.has(metaPath()) && !S.writing.has(metaPath()) && JSON.stringify(stripTs(cur.data)) !== JSON.stringify(stripTs(S.post))) {
      S.post = clone(cur.data); renderMeta(); renderBoard(); renderLibrary(); scheduleDraw();
    }
    renderMeta();
  }, err => { console.warn(err); $("#boot") && ($("#boot").innerHTML = `<h2>Couldn’t load your posts</h2><p>Reload the page to try again.</p>`); });
}
boot();
})();
